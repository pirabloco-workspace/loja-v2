<footer class="pb-footer" aria-label="Rodapé PiraBloco">

  

  <style>

    /* =========================================

       ESTILO EXCLUSIVO DO RODAPÉ (DARK MODE)

       ========================================= */

    .pb-footer {

      width: 100%;

      max-width: 1112px;

      margin: 40px auto 20px;

      padding: 0 16px;

      font-family: 'Segoe UI', system-ui, sans-serif;

    }



    .pb-footerCard {

      /* Fundo Turquesa Escuro */

      background: #1c5e68; 

      color: #ffffff;

      

      border-radius: 24px;

      padding: 40px 24px; /* Mais espaçamento interno */

      box-shadow: 0 10px 30px rgba(28, 94, 104, 0.15);

      

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 30px; /* Espaço entre ícones e texto */

      text-align: center;

    }



    /* --- REDES SOCIAIS (AUMENTADAS) --- */

    .pb-footerSocial {

      display: flex;

      gap: 20px; /* Mais espaço entre as bolinhas */

      justify-content: center;

      align-items: center;

    }



    .pb-footerIcon {

      /* Bolinha Maior */

      width: 56px; 

      height: 56px;

      

      border-radius: 50%;

      /* Fundo translúcido (Glass Effect) */

      background: rgba(255, 255, 255, 0.1); 

      border: 2px solid rgba(255, 255, 255, 0.2);

      color: #ffffff;



      display: grid;

      place-items: center;

      text-decoration: none;

      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);

    }



    /* Ícone SVG Maior */

    .pb-footerIcon svg {

      width: 28px; 

      height: 28px;

      stroke-width: 2;

      transition: transform 0.3s;

    }



    /* Efeito Hover (Passar o mouse) */

    .pb-footerIcon:hover {

      background: #ffffff;

      color: #1c5e68; /* Ícone vira turquesa */

      border-color: #ffffff;

      transform: translateY(-4px);

      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);

    }

    .pb-footerIcon:hover svg {

      transform: scale(1.1); /* Ícone cresce um pouquinho */

    }



    /* --- TEXTOS (AUMENTADOS) --- */

    .pb-footerBottom {

      width: 100%;

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 8px;

      opacity: 0.9;

    }



    .pb-footerCopy {

      font-size: 15px; /* Fonte maior */

      font-weight: 500;

      letter-spacing: 0.3px;

      line-height: 1.5;

    }



    .pb-footerRights {

      font-size: 13px;

      opacity: 0.7;

    }



    /* Mobile Ajustes */

    @media (max-width: 600px) {

      .pb-footerCard { padding: 30px 20px; }

      .pb-footerIcon { width: 48px; height: 48px; }

      .pb-footerIcon svg { width: 24px; height: 24px; }

      .pb-footerCopy { font-size: 14px; }

    }

  </style>



  <div class="pb-footerCard">

    

    <div class="pb-footerSocial" aria-label="Nossas Redes">

      

      <a class="pb-footerIcon" href="https://www.instagram.com/percival.brics?igsh=aTIxNnRlYzc5Zmhr" target="_blank" aria-label="Instagram">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">

          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>

          <path d="M16 11.37a4 4 0 1 1-7.88 1.26 4 4 0 0 1 7.88-1.26Z"></path>

          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>

        </svg>

      </a>



      <a class="pb-footerIcon" href="https://youtube.com/@percivalbrics?si=5iWR6pzh-5TzGh9L" target="_blank" aria-label="YouTube">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">

          <path d="M22.54 6.42a2.78 2.78 0 0 0-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46A2.78 2.78 0 0 0 1.46 6.42 29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58 2.78 2.78 0 0 0 1.95 1.96C5.12 20 12 20 12 20s6.88 0 8.59-.46a2.78 2.78 0 0 0 1.95-1.96A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58Z"></path>

          <polygon points="10 15 15 12 10 9 10 15"></polygon>

        </svg>

      </a>



      <a class="pb-footerIcon" href="https://www.tiktok.com/@percival.brics?_r=1&_t=ZS-92eP7uM9L9u" target="_blank" aria-label="TikTok">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">

           <path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"></path>

        </svg>

      </a>



    </div>



    <div class="pb-footerBottom">

      <span class="pb-footerCopy">

        <strong>PiraBloco®</strong> &bull; <span id="pbFooterYear"></span>

      </span>

      <span class="pb-footerRights">

        Todos os direitos reservados

      </span>

    </div>



  </div>

    document.getElementById("pbFooterYear").textContent = new Date().getFullYear();

  </script>



</footer>
