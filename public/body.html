<main class="pb-body">
  
  <div class="pb-bannerWrap">
    <div class="pb-banner" aria-label="Destaques">
      <div class="pb-bannerTrack" id="pbBannerTrack">
        <div class="pb-bannerSlide is-active">
          <picture>
             <source media="(max-width: 600px)" srcset="imagens/banners/banner-pb1-mobile.svg">
             <img src="imagens/banners/banner-pb1.svg" alt="Bem-vindo ao PiraBloco">
          </picture>
        </div>
        <div class="pb-bannerSlide">
          <picture>
             <source media="(max-width: 600px)" srcset="imagens/banners/banner-pb2-mobile.svg">
             <img src="imagens/banners/banner-pb2.svg" alt="Compra Segura">
          </picture>
        </div>
      </div>
      <div class="pb-dots" id="pbBannerDots">
        <span class="pb-dot is-active"></span>
        <span class="pb-dot"></span>
      </div>
    </div>
  </div>

  <div class="pb-controls">
    <div class="pb-searchBox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <input type="text" class="pb-searchInput" placeholder="Buscar por nome ou SKU..." id="pbSearchInput" autocomplete="off">
    </div>
    
    <button id="pbSoldToggle" class="pb-soldBtn" type="button" aria-pressed="false">
      <span>👁️ Ver Vendidos</span>
    </button>
  </div>

  <div class="pb-gridWrap">
    
    <div class="pb-paginationWrap" id="pbPagTop"></div>

    <div id="pbHomeGrid" class="pb-productsGrid" aria-live="polite">
      <div style="grid-column:1/-1; text-align:center; padding:60px 20px; color:#888;">
        Carregando galáxia...
      </div>
    </div>

    <div class="pb-paginationWrap" id="pbPagBottom"></div>

  </div>

  <div class="pb-deckSection">
    <h3 class="pb-deckTitle">Navegue por Categoria</h3>
    <div class="pb-deckGrid">
      
      <a href="catalogo.html?tag=minifiguras" class="pb-deckCard">
        <div class="pb-deckImg">
          <img src="imagens/categorias/minifiguras.svg" alt="Minifiguras" onerror="this.style.display='none'">
        </div>
        <span class="pb-deckName">Minifiguras</span>
      </a>
      
      <a href="catalogo.html?tag=pecas" class="pb-deckCard">
        <div class="pb-deckImg">
          <img src="imagens/categorias/pecas.svg" alt="Peças" onerror="this.style.display='none'">
        </div>
        <span class="pb-deckName">Peças</span>
      </a>
      
      <a href="catalogo.html?tag=acessorios" class="pb-deckCard">
        <div class="pb-deckImg">
          <img src="imagens/categorias/acessorios.svg" alt="Acessórios" onerror="this.style.display='none'">
        </div>
        <span class="pb-deckName">Acessórios</span>
      </a>

    </div>
  </div>

</main>

<div class="pb-modal" id="pbModal" aria-hidden="true" style="display:none;">
  <div class="pb-modalOverlay" id="pbModalOverlay"></div>
  <div class="pb-modalPanel" role="dialog">
    <div class="pb-modalHeader">
      <h3 class="pb-modalTitle" id="pbModalTitle">Produto</h3>
      <button class="pb-modalClose" id="pbModalClose" type="button">✕</button>
    </div>
    
    <div class="pb-modalGrid">
      <div>
        <div class="pb-modalImgBox"><img id="pbModalMainImg" src="" alt=""></div>
        <div class="pb-thumbs" id="pbModalThumbs"></div>
      </div>
      
      <div class="pb-modalInfo">
        <div class="pb-modalSku" id="pbModalSku"></div>
        <div class="pb-modalPrice" id="pbModalPrice"></div>
        <div class="pb-modalDesc" id="pbModalDesc"></div>
        
        <div class="pb-modalActions">
          <div class="pb-chip" id="pbModalStock"></div>
          
          <div class="pb-qtyRow">
             <input type="number" id="pbModalQty" value="1" min="1" class="pb-qtyInput">
             <button class="pb-ctaBtn" id="pbModalAddBtn">Adicionar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="pbToast"><span id="pbToastText"></span></div>
