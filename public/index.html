<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PiraBloco® - Oficial</title>
    <style>
        body { margin: 0; background: #f2f2f2; font-family: sans-serif; }
        .pb-shell-loading { opacity: 0; transition: opacity 0.3s ease; }
        .pb-shell-visible { opacity: 1; }
    </style>
</head>
<body>

    <div id="header-mount"></div>

    <main id="main-mount" class="pb-shell-loading"></main>

    <div id="footer-mount"></div>

    <script>
        async function bootPiraBloco() {
            try {
                // ORDEM SUPREMA DO PRINCÍPIO DOS 6
                
                // 1º: Style (Visual)
                const resStyle = await fetch('style.html');
                const textStyle = await resStyle.text();
                document.head.insertAdjacentHTML('beforeend', textStyle);

                // 2º: Cabeçalho (Hub)
                const resHeader = await fetch('cabecalho.html');
                const htmlHeader = await resHeader.text();
                document.getElementById('header-mount').innerHTML = htmlHeader;

                // 3º: Body (Vitrine)
                const resBody = await fetch('body.html');
                const htmlBody = await resBody.text();
                const mainMount = document.getElementById('main-mount');
                mainMount.innerHTML = htmlBody;
                mainMount.classList.add('pb-shell-visible'); // Revela o corpo suavemente

                // 4º: Rodapé (Confiança)
                const resFooter = await fetch('rodape.html');
                const htmlFooter = await resFooter.text();
                document.getElementById('footer-mount').innerHTML = htmlFooter;

                // 5º: Script.js (O Motor) - Só liga depois de tudo montado
                const script = document.createElement('script');
                script.src = 'script.js';
                document.body.appendChild(script);

                console.log("PiraBloco: Sistema dos 6 carregado com sucesso.");

            } catch (err) {
                console.error("Erro Crítico PiraBloco:", err);
                document.body.innerHTML = "<h2 style='text-align:center; padding:50px;'>Erro de carregamento. Verifique sua conexão.</h2>";
            }
        }

        window.addEventListener('DOMContentLoaded', bootPiraBloco);
    </script>
</body>
</html>
