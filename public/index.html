<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PiraBloco® - Peças e Minifiguras LEGO</title>
    
    <link rel="stylesheet" href="style.html">
    
    <style>
        /* Ajuste para evitar que o conteúdo suma debaixo do header fixo */
        body { padding-top: 0; }
        #header-placeholder { width: 100%; }
        .main-content { min-height: 80vh; }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <div class="main-content">
        <div class="pb-bannerWrap">
            <div class="pb-banner">
                <div class="pb-bannerTrack">
                    <div class="pb-bannerSlide"><img src="imagens/banner1.webp" alt="Promoção 1"></div>
                    <div class="pb-bannerSlide"><img src="imagens/banner2.webp" alt="Promoção 2"></div>
                    <div class="pb-bannerSlide"><img src="imagens/banner3.webp" alt="Promoção 3"></div>
                </div>
                <div class="pb-dots">
                    <div class="pb-dot is-active"></div>
                    <div class="pb-dot"></div>
                    <div class="pb-dot"></div>
                </div>
            </div>
        </div>

        <div class="pb-controls">
            <div class="pb-searchBox">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" class="pb-searchInput" placeholder="Buscar peças ou sets...">
            </div>
            <button class="pb-soldBtn" id="toggleSold">
                <span>MOSTRAR VENDIDOS</span>
            </button>
        </div>

        <div class="pb-gridWrap">
            <div class="pb-productsGrid" id="productsGrid">
                </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Função para carregar o cabeçalho dinamicamente
        async function loadHeader() {
            try {
                const response = await fetch('cabecalho.html');
                const data = await response.text();
                document.getElementById('header-placeholder').innerHTML = data;
                
                // IMPORTANTE: Após carregar o cabeçalho, precisamos garantir 
                // que as funções de abrir o menu funcionem.
                // Se o script do menu estiver dentro do cabecalho.html, ele rodará sozinho.
            } catch (error) {
                console.error('Erro ao carregar o cabeçalho:', error);
            }
        }
        
        // Inicia o carregamento
        loadHeader();
    </script>

</body>
</html>
