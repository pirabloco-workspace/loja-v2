cat > ~/loja-v2/public/cabecalho.html << 'EOF'
<header class="pb-header">
    <div class="pb-logo-container">
        <h1 class="pb-logo-text">
            PiraBloco<sup class="pb-registered">&reg;</sup>
        </h1>
    </div>
</header>

<style>
    /* O Container do Cabeçalho - Fundo Branco Limpo */
    .pb-header {
        width: 100%;
        height: 70px; /* Altura fixa para não empurrar o layout */
        background: #ffffff; 
        box-shadow: 0 4px 20px rgba(0,0,0,0.06); /* Sombra suave */
        display: flex;
        justify-content: center;
        align-items: center;
        
        /* Garante que fique no topo sempre */
        position: sticky; 
        top: 0;
        z-index: 999; 
    }

    /* O Texto PiraBloco com Degradê "Deep Turquoise" */
    .pb-logo-text {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 28px;
        font-weight: 900; /* Extra Grosso para a marca */
        margin: 0;
        letter-spacing: -0.5px;
        line-height: 1;
        
        /* O Efeito de Degradê Escuro */
        background: linear-gradient(135deg, #0e3d45 0%, #1c5e68 50%, #2a8a9c 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        color: #1c5e68; /* Fallback se o navegador não aceitar degradê */
    }

    /* O Ajuste do "R" - Pequeno, Fino e Nítido */
    .pb-registered {
        font-size: 10px; /* Tamanho fixo para leitura */
        vertical-align: top; /* Joga para cima */
        margin-left: 2px;
        margin-top: 2px;
        display: inline-block;
        
        /* O SEGREDO: Tirar o peso bold para não borrar */
        font-weight: 500; 
        
        /* Cor sólida (sem o degradê) para ficar bem nítido */
        -webkit-text-fill-color: #1c5e68; 
        color: #1c5e68;
        opacity: 0.8;
    }
</style>
EOF
